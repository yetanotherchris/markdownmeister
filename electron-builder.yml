appId: com.yetanotherchris.markdownmeister
productName: MarkdownMeister
# The packaged launcher binary is `markdownmeister` (markdownmeister.exe on
# Windows) on every platform (spec 019); productName keeps the human-facing app
# identity.
executableName: markdownmeister
directories:
  output: dist

# electron-vite build output (out/**) is the packaged runtime; package.json is
# the entry (main: ./out/main/index.js). Production node_modules are included
# automatically by electron-builder.
files:
  - "!**/.vscode/*"
  - "!src/**"
  - "!specs/**"
  - "!docs/**"
  - "!tests/**"
  - "!scripts/**"
  - "!*.config.{ts,mjs}"
  - "!{tsconfig.json,tsconfig.main.json,tsconfig.preload.json,tsconfig.renderer.json,vitest.workspace.ts}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}"
  - "!{.gitignore,AGENTS.md,CLAUDE.md,LICENSE}"
  - "!update{scoop,brew}.ps1"
  - "!Formula/**"
  - "!markdownmeister.json"
  - "!.github/**"
  - "!.specify/**"
  - "!test-results/**"
  - "!playwright-report/**"

# The Scoop manifest hooks (markdownmeister.json) call this script to
# register/remove the "Open with" context-menu verbs on a portable install,
# which has no installer to do it. It is shipped into the packaged app's
# `resources/` (Scoop reaches it at `<dir>\resources\scripts\open-with.ps1`);
# the Windows installer has its own NSIS registration and ignores it.
#
# Spec 039: the 512x512 product PNG ships alongside them so the main process
# can hand the BrowserWindow its icon at runtime. When packaged, this mapping's
# destination (<resources>/icon.png) is what src/main/index.ts resolves via
# process.resourcesPath (src/main/windowIcon.ts); in dev it resolves the
# dev-tree resources/icon.png relative to out/main.
extraResources:
  - from: scripts/open-with.ps1
    to: scripts/open-with.ps1
  - from: resources/icon.png
    to: icon.png

# Every asset name carries product-version-os-arch (FR-005). The os token is
# literal per platform so names read windows/macos/linux rather than electron-
# builder's win/mac/linux abbreviations (contracts/release.md §2). The product
# token is the short prefix `markdownmeister` (spec 019).
win:
  artifactName: markdownmeister-${version}-windows-${arch}.${ext}
  # Spec 039: embedded into the exe (taskbar/title bar, Scoop shortcuts,
  # installer.nsh verb icons) and defaulted into the NSIS installer/uninstaller
  # UI. Validated: app-builder-lib requires a >=256 entry, which the ICO has.
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

# Spec 006 (FR-001/002/012): the Windows installer registers per-user Explorer
# context-menu verbs (scripts/installer.nsh) instead of electron-builder's
# `fileAssociations`, which would take over the default handler (research R2).
nsis:
  include: scripts/installer.nsh

mac:
  artifactName: markdownmeister-${version}-macos-${arch}.${ext}
  # Spec 039: bundled as Contents/Resources/icon.icns with CFBundleIconFile
  # pointed at it, driving Dock/Finder/Applications/Cmd-Tab (research D1).
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Spec 006 (FR-003/004/012, research R3/R4): declare the app's document types
  # so it appears in Finder's "Open With…" for .md/.markdown files and folders
  # WITHOUT becoming the default handler (role Viewer, LSHandlerRank Alternate).
  # electron-builder cannot express the folder type, so the full array is set
  # here rather than via `fileAssociations`.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: MarkdownMeister Markdown Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        CFBundleTypeExtensions:
          - md
          - markdown
      - CFBundleTypeName: MarkdownMeister Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder

linux:
  # Hard-code x64 rather than using ${arch}: electron-builder's ${arch} macro
  # resolves to "x86_64" for Linux, but the release contract names every asset
  # with os-arch tokens (linux-x64.AppImage, contracts/release.md §2).
  artifactName: markdownmeister-${version}-linux-x64.${ext}
  # Spec 039: directory form - the whole NxN.png ladder is staged into the
  # AppImage's usr/share/icons/hicolor/<size>/apps/ tree, and the largest is
  # symlinked to .DirIcon + markdownmeister.png at the mount root, which are
  # exactly the candidates src/main/linuxDesktopEntry.ts searches (research D2).
  icon: resources/icons
  target:
    - target: AppImage
      arch: [x64]
