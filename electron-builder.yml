appId: com.yetanotherchris.markdownmeister
productName: MarkdownMeister
executableName: markdownmeister
directories:
  output: dist

# electron-vite build output (out/**) is the packaged runtime; package.json is
# the entry (main: ./out/main/index.js). Production node_modules are included
# automatically by electron-builder.
files:
  - "!**/.vscode/*"
  - "!src/**"
  - "!specs/**"
  - "!docs/**"
  - "!tests/**"
  - "!scripts/**"
  - "!*.config.{ts,mjs}"
  - "!{tsconfig.json,tsconfig.main.json,tsconfig.preload.json,tsconfig.renderer.json,vitest.workspace.ts}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}"
  - "!{.gitignore,AGENTS.md,CLAUDE.md,LICENSE}"
  - "!update{scoop,brew}.ps1"
  - "!Formula/**"
  - "!markdownmeister.json"
  - "!.github/**"
  - "!.specify/**"
  - "!test-results/**"
  - "!playwright-report/**"

extraResources:
  - from: scripts/open-with.ps1
    to: scripts/open-with.ps1
  - from: resources/icon.png
    to: icon.png

win:
  artifactName: markdownmeister-${version}-windows-${arch}.${ext}
  icon: resources/icon.ico
  # The multi-size container ships beside the exe so the running window can
  # hand the OS native-size frames.
  extraResources:
    - from: resources/icon.ico
      to: icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  include: scripts/installer.nsh

afterPack: scripts/copy-shell-extension.cjs

appx:
  # Partner Center, Product setup, Package/Identity name (individual
  # accounts: e.g. "12345YourName.MarkdownMeister"). Placeholder below.
  identityName: ReplaceWithPartnerCenterIdentity.MarkdownMeister
  # Partner Center, Product setup, Publisher (format "CN=<GUID>").
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: MarkdownMeister
  displayName: MarkdownMeister
  applicationId: MarkdownMeister
  # Spec 062 FR-011: the only capability a full-trust desktop app needs. Do not
  # add others; the package must not declare capabilities it does not use.
  capabilities:
    - runFullTrust
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
  # The alias + packaged-COM + windows.fileExplorerContextMenus declarations,
  # spliced into the generated AppxManifest.xml (packaging/appx/extensions.xml).
  customExtensionsPath: packaging/appx/extensions.xml

mac:
  artifactName: markdownmeister-${version}-macos-${arch}.${ext}
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: MarkdownMeister Markdown Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        CFBundleTypeExtensions:
          - md
          - markdown
      - CFBundleTypeName: MarkdownMeister Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder

linux:
  artifactName: markdownmeister-${version}-linux-x64.${ext}
  icon: resources/icons
  target:
    - target: AppImage
      arch: [x64]

# Spec 064: the Snap Store channel. Deliberately absent from linux.target so
# the direct-download AppImage build is unchanged; build-linux-store.yml
# selects it with `--linux snap`. electron-builder packs it from the core22
# Electron snap template, so the CI host needs no snapcraft and no VM.
snap:
  title: MarkdownMeister
  summary: A free WYSIWYG markdown editor for Windows, macOS and Linux.
  description: |
    MarkdownMeister is a free, open-source markdown editor. Write with a live
    preview or edit the raw source, browse a folder in the sidebar, and keep
    several documents open in tabs. Your files stay plain markdown on disk.
  confinement: strict
  grade: stable
  # The interfaces this app actually uses (spec 064 FR-019). The electron-builder
  # defaults `network`, `audio-playback`, and `pulseaudio` are omitted because
  # the app makes no network or audio calls; `removable-media` is left
  # undeclared and connected by the user for folders outside $HOME.
  plugs:
    - desktop
    - desktop-legacy
    - home
    - x11
    - wayland
    - unity7
    - browser-support
    - gsettings
    - opengl
