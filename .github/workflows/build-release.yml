name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Assert tag matches strict semver
        shell: bash
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${{ github.ref_name }} does not match vMAJOR.MINOR.PATCH (v[0-9]+.[0-9]+.[0-9]+)."
            exit 1
          fi

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${{ github.ref_name }}" refs/remotes/origin/main; then
            echo "Tag ${{ github.ref_name }} is reachable from main"
          else
            echo "::error::Tag ${{ github.ref_name }} is not reachable from main; no release will be created."
            exit 1
          fi

      - name: Check the tag has no existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::A release for tag ${{ github.ref_name }} already exists; refusing to overwrite it."
            exit 1
          fi
          echo "No existing release for ${{ github.ref_name }}"

  build:
    # Only run the expensive four-leg matrix once the cheap validation passed.
    needs: validate
    # Scope Apple signing credentials to jobs using this environment.
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            suffix: windows-x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            suffix: macos-x64
          - os: macos-latest
            platform: macos
            arch: arm64
            suffix: macos-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            suffix: linux-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying Electron download in 20 seconds (attempt $attempt of 3)."
              sleep 20
            fi
          done

          echo "::error::npm ci failed after 3 attempts."
          exit 1

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: npm run build

      - name: Prepare macOS signing credentials
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/markdownmeister-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          keychain_path="$RUNNER_TEMP/markdownmeister-signing.keychain-db"

          {
            echo "CSC_LINK=$certificate_path"
            echo "APPLE_API_KEY=$api_key_path"
            echo "MACOS_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

          : "${MACOS_CERTIFICATE_P12_BASE64:?Missing MACOS_CERTIFICATE_P12_BASE64}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${APPLE_API_KEY_P8_BASE64:?Missing APPLE_API_KEY_P8_BASE64}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY}"
          : "${MACOS_KEYCHAIN_PASSWORD:?Missing MACOS_KEYCHAIN_PASSWORD}"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --x64 --publish never --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        env:
          CSC_NAME: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-builder --mac dir --${{ matrix.arch }} --publish never --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}
          node scripts/package-macos-artifacts.mjs --artifacts-dir dist --version ${{ steps.version.outputs.VERSION }} --arch ${{ matrix.arch }}

      - name: Verify final macOS artifacts
        if: matrix.platform == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: >-
          node scripts/verify-macos-artifacts.mjs --artifacts-dir dist
          --version ${{ steps.version.outputs.VERSION }} --arch ${{ matrix.arch }}
          --identity "$MACOS_SIGNING_IDENTITY"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: artifacts-${{ matrix.suffix }}
          path: |
            dist/markdownmeister-*.exe
            dist/markdownmeister-*.zip
            dist/markdownmeister-*.dmg
            dist/markdownmeister-*.AppImage
            dist/markdownmeister_*.deb
          if-no-files-found: error

      - name: Remove macOS signing credentials
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/markdownmeister-certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ] && [ -e "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH"
          fi

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    environment: macos-signing

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22

      - name: Download all artifacts into separate directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          path: downloaded-artifacts
          pattern: artifacts-*
          merge-multiple: false

      - name: Assemble release artifacts without collisions
        run: >-
          node scripts/assemble-release-artifacts.mjs --downloads-dir downloaded-artifacts
          --artifacts-dir artifacts --version ${{ steps.version.outputs.VERSION }}

      - name: Verify downloaded macOS artifacts before publishing
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY}"
          for arch in x64 arm64; do
            node scripts/verify-macos-artifacts.mjs --artifacts-dir artifacts \
              --version ${{ steps.version.outputs.VERSION }} --arch "$arch" \
              --identity "$MACOS_SIGNING_IDENTITY"
          done

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v3
        with:
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Checkout main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git pull --rebase origin main

      - name: Update Scoop manifest
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./updatescoop.ps1 -Version "$env:RELEASE_VERSION" -ArtifactsDir artifacts

      - name: Update Homebrew formula
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./updatebrew.ps1 -Version "$env:RELEASE_VERSION" -ArtifactsDir artifacts

      - name: Sync package.json version to tag
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./updatepackagejson.ps1 -Version "$env:RELEASE_VERSION"

      - name: Commit updated package definitions
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # stefanzweifel/git-auto-commit-action v7
        with:
          commit_message: 'chore(release): update package definitions to v${{ steps.version.outputs.VERSION }}'
          branch: main
          file_pattern: markdownmeister.json Formula/markdownmeister.rb package.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v3
        with:
          tag_name: ${{ github.ref_name }}
