name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Assert tag matches strict semver
        shell: bash
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${{ github.ref_name }} does not match vMAJOR.MINOR.PATCH (v[0-9]+.[0-9]+.[0-9]+)."
            exit 1
          fi

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${{ github.ref_name }}" refs/remotes/origin/main; then
            echo "Tag ${{ github.ref_name }} is reachable from main"
          else
            echo "::error::Tag ${{ github.ref_name }} is not reachable from main; no release will be created."
            exit 1
          fi

      - name: Check the tag has no existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::A release for tag ${{ github.ref_name }} already exists; refusing to overwrite it."
            exit 1
          fi
          echo "No existing release for ${{ github.ref_name }}"

  build:
    # Only run the expensive four-leg matrix once the cheap validation passed.
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            suffix: windows-x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            suffix: macos-x64
          - os: macos-latest
            platform: macos
            arch: arm64
            suffix: macos-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            suffix: linux-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying Electron download in 20 seconds (attempt $attempt of 3)."
              sleep 20
            fi
          done

          echo "::error::npm ci failed after 3 attempts."
          exit 1

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: npm run build

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --x64 --publish never --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never --config.extraMetadata.version=${{ steps.version.outputs.VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: artifacts-${{ matrix.suffix }}
          path: |
            dist/markdownmeister-*.exe
            dist/markdownmeister-*.zip
            dist/markdownmeister-*.dmg
            dist/markdownmeister-*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify required artifact set
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "markdownmeister-${{ steps.version.outputs.VERSION }}-windows-x64.exe"
            "markdownmeister-${{ steps.version.outputs.VERSION }}-windows-x64.zip"
            "markdownmeister-${{ steps.version.outputs.VERSION }}-macos-x64.dmg"
            "markdownmeister-${{ steps.version.outputs.VERSION }}-macos-x64.zip"
            "markdownmeister-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg"
            "markdownmeister-${{ steps.version.outputs.VERSION }}-macos-arm64.zip"
            "markdownmeister-${{ steps.version.outputs.VERSION }}-linux-x64.AppImage"
          )
          for f in "${required[@]}"; do
            if [ ! -s "artifacts/$f" ]; then
              echo "::error::Required release artifact missing or empty: $f"
              exit 1
            fi
            echo "verified: $f"
          done

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v3
        with:
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Checkout main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git pull --rebase origin main

      - name: Update Scoop manifest
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./updatescoop.ps1 -Version "$env:RELEASE_VERSION" -ArtifactsDir artifacts

      - name: Update Homebrew formula
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./updatebrew.ps1 -Version "$env:RELEASE_VERSION" -ArtifactsDir artifacts

      - name: Sync package.json version to tag
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./updatepackagejson.ps1 -Version "$env:RELEASE_VERSION"

      - name: Commit updated package definitions
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # stefanzweifel/git-auto-commit-action v7
        with:
          commit_message: 'chore(release): update package definitions to v${{ steps.version.outputs.VERSION }}'
          branch: main
          file_pattern: markdownmeister.json Formula/markdownmeister.rb package.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v3
        with:
          tag_name: ${{ github.ref_name }}
