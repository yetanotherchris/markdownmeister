name: Build Linux store package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build, matching the release tag (for example 1.7.0).'
        required: true
        type: string
      publish:
        description: 'Upload the snap to the stable channel. Leave off to only build and verify.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-linux-store
  cancel-in-progress: false

jobs:
  build-linux-store:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying Electron download in 20 seconds (attempt $attempt of 3)."
              sleep 20
            fi
          done
          echo "::error::npm ci failed after 3 attempts."
          exit 1

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/linux-store-submission.mjs validate --version "$VERSION"

      - name: Assert the version matches the dispatched release tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/linux-store-submission.mjs assert-tag --version "$VERSION" --ref "$REF_NAME"

      - name: Require a release tag to publish
        if: ${{ inputs.publish && github.ref_type != 'tag' }}
        run: |
          echo "::error::Publishing to the Snap Store requires dispatching from a release tag."
          exit 1

      - name: Build app
        run: npm run build

      - name: Package the snap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx electron-builder --linux snap --x64 --publish never -c.extraMetadata.version="$VERSION"

      - name: Verify the produced snap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          snap_file="$(ls dist/*.snap | head -n 1)"
          test -n "$snap_file"
          node scripts/linux-store-submission.mjs check-artifact --name "$(basename "$snap_file")" --version "$VERSION"

      - name: Publish to the Snap Store (stable)
        if: ${{ inputs.publish && github.ref_type == 'tag' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        shell: bash
        run: |
          node scripts/linux-store-submission.mjs require-credentials
          sudo snap install snapcraft --classic || true
          snap_file="$(ls dist/*.snap | head -n 1)"
          snapcraft upload --release=stable "$snap_file"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: artifacts-linux-x64-snap
          path: dist/*.snap
          if-no-files-found: error

      - name: Install the snap for the smoke test
        shell: bash
        run: |
          snap_file="$(ls dist/*.snap | head -n 1)"
          sudo snap install --dangerous "$snap_file"
          snap list markdownmeister

      - name: Assert the auto-connected interfaces are present
        shell: bash
        run: |
          connections="$(snap connections markdownmeister)"
          echo "$connections"
          for plug in home x11 wayland gsettings browser-support; do
            if ! grep -q "markdownmeister:$plug" <<<"$connections"; then
              echo "::error::expected interface markdownmeister:$plug is not present"
              exit 1
            fi
          done

      - name: Smoke-run the snap under Xvfb (FR-006)
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          mkdir -p "$HOME/smoke-workspace"
          printf '# smoke\n\nhello from the snap\n' > "$HOME/smoke-workspace/smoke.md"
          set +e
          xvfb-run -a timeout --signal=TERM 30 snap run markdownmeister "$HOME/smoke-workspace" >"$RUNNER_TEMP/mm-smoke.log" 2>&1
          code=$?
          set -e
          echo "snap run exit code: $code"
          cat "$RUNNER_TEMP/mm-smoke.log" || true
          # 124 means the timeout killed a still-running app, which is what we want.
          if [ "$code" -ne 124 ]; then
            echo "::error::the snap exited before the timeout (code $code); it must stay running."
            exit 1
          fi

      - name: Remove the snap and check it left no desktop entry (FR-017)
        shell: bash
        run: |
          sudo snap remove markdownmeister
          if [ -f "$HOME/.local/share/applications/markdownmeister.desktop" ]; then
            echo "::error::removing the snap left a desktop entry behind"
            exit 1
          fi
