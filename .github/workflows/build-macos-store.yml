name: Build and upload Mac App Store package

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: 'Build number (1-9999). Leave blank to use the workflow run number. Increase for a repeat upload.'
        required: false
        type: string
        default: ''
      upload:
        description: 'Upload the verified package to App Store Connect for processing.'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-app-store
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Run Mac App Store delivery from main.'
            exit 1
          fi

  build-and-upload:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: macos-signing
    env:
      MACOS_STORE_BUILD_NUMBER: ${{ inputs.buildNumber || github.run_number }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate version and initialize temporary paths
        run: |
          python3 scripts/macos_store.py inputs
          echo "STORE_CREDENTIALS=$RUNNER_TEMP/markdownmeister-store-credentials" >> "$GITHUB_ENV"
          echo "MACOS_STORE_PROFILE_PATH=$RUNNER_TEMP/markdownmeister-store-credentials/store.provisionprofile" >> "$GITHUB_ENV"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Prepare Store credentials and validate profile
        env:
          MACOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
          MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
          MACOS_APP_STORE_INSTALLER_P12_BASE64: ${{ secrets.MACOS_APP_STORE_INSTALLER_P12_BASE64 }}
          MACOS_APP_STORE_INSTALLER_PASSWORD: ${{ secrets.MACOS_APP_STORE_INSTALLER_PASSWORD }}
          MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/macos_store.py prepare --credentials "$STORE_CREDENTIALS"

      - name: Build app
        run: npm run build

      - name: Package universal Store app and signed installer
        env:
          CSC_LINK: ${{ runner.temp }}/markdownmeister-store-credentials/app.p12
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ runner.temp }}/markdownmeister-store-credentials/installer.p12
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MACOS_APP_STORE_INSTALLER_PASSWORD }}
        run: npx electron-builder --config packaging/macos/store.mjs --mac mas --universal --publish never

      - name: Verify Store app and installer
        run: python3 scripts/macos_store.py verify --credentials "$STORE_CREDENTIALS"

      - name: Retain verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: macos-app-store-${{ env.MACOS_STORE_BUILD_NUMBER }}-${{ github.run_attempt }}
          path: dist-store/**/*.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Validate and upload to App Store Connect
        if: inputs.upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/macos_store.py upload --credentials "$STORE_CREDENTIALS"

      - name: Delivery summary
        env:
          UPLOAD_REQUESTED: ${{ inputs.upload }}
        run: |
          {
            echo '## Mac App Store delivery'
            echo "Build number: $MACOS_STORE_BUILD_NUMBER"
            echo 'Bundle identifier: dev.yetanotherchris.markdownmeister'
            echo "Upload requested: $UPLOAD_REQUESTED"
            echo 'The verified universal .pkg is available in the workflow artifacts.'
            if [ "$UPLOAD_REQUESTED" = 'true' ]; then
              echo 'Upload accepted. Check App Store Connect for processing status.'
              echo 'Testing, App Review submission, and release remain manual.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/markdownmeister-store-credentials"
