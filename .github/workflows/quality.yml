name: Quality Gates

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'eslint.config.mjs'
      - 'playwright.config.ts'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'eslint.config.mjs'
      - 'playwright.config.ts'
      - 'tsconfig*.json'
      - 'vitest.config.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Maintainability
        run: npm run check
      - name: Unit tests
        run: npm test

  # Two shards on separate runners. Each keeps one Electron app at a time
  # (workers: 1 in playwright.config.ts), because two concurrent apps make the
  # large-file open in open-performance.spec.ts time out on a shared runner.
  # Sharding halves the wall-clock without that contention.
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build e2e image
        run: docker build -f tests/e2e/Dockerfile -t markdownmeister-e2e .
      - name: End-to-end tests (shard ${{ matrix.shard }} of 2)
        run: >-
          docker run --name markdownmeister-e2e-${{ matrix.shard }} --shm-size=1g markdownmeister-e2e
          sh -lc 'xvfb-run -a env MM_E2E_HEADED=1 npm run test:e2e -- --shard=${{ matrix.shard }}/2'
      - name: Copy failure traces
        if: failure()
        run: docker cp markdownmeister-e2e-${{ matrix.shard }}:/workspace/test-results ./test-results
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: test-results/
      - name: Remove e2e container
        if: always()
        run: docker rm -f markdownmeister-e2e-${{ matrix.shard }} || true
