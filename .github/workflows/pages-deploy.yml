name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute deploy version
        id: version
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$VERSION" ]; then
            VERSION="$(npm pkg get version | tr -d '"')"
          fi
          # Repository-controlled string: reject anything that could terminate
          # the sed program early or smuggle extra GITHUB_OUTPUT fields.
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Refusing unsafe version string: ${VERSION}"
            exit 1
          fi
          {
            echo "version<<MM_VERSION_EOF"
            echo "${VERSION#v}"
            echo "MM_VERSION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp deploy version into the page
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/__MM_DEPLOY_VERSION__/${VERSION}/g" docs/site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages v6.0.0
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact v5.0.0
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # actions/deploy-pages v5.0.0
