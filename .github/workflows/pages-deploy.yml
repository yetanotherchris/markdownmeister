name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Compute deploy version
        id: version
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$VERSION" ]; then
            VERSION="$(npm pkg get version | tr -d '"')"
          fi
          # Repository-controlled string: reject anything that could break the
          # JSON file or smuggle extra output fields.
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Refusing unsafe version string: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the deploy version into the site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: printf '{"version":"%s"}\n' "$VERSION" > docs/site/public/version.json

      - name: Build the site
        run: npm run docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages v6.0.0
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact v5.0.0
        with:
          path: docs/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # actions/deploy-pages v5.0.1
